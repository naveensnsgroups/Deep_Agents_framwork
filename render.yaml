services:
  - type: web
    name: deep-agents-ide-server
    runtime: node
    plan: free
    branch: cloud
    buildCommand: npm install && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      # Set whichever of these you actually plan to use — none are required at deploy
      # time, only when a session picks that provider. PORT is set automatically by
      # Render; the server already reads it via process.env.PORT.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
    # Render's free-tier disk is ephemeral — wiped on every deploy and on restarts after
    # idling. That means chat history (sessions.sqlite) and any cloned GitHub workspaces
    # under .data/ do NOT survive a redeploy on the free plan. Add a paid persistent Disk
    # mounted at apps/server/.data if you need that to survive; otherwise each redeploy
    # starts fresh (re-clone on next "Open Workspace", empty chat history).
    # disk:
    #   name: deep-agents-data
    #   mountPath: /opt/render/project/src/apps/server/.data
    #   sizeGB: 1
