<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Migration Agents</title>
    <script>
      // Runs before React mounts (and before first paint) so a returning visitor who chose
      // light never sees a flash of the dark default while lib/theme.ts's own effect catches up.
      try {
        if (localStorage.getItem("deepagents-ide:theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
